<style>

    .m10{--ma:#7FBECB; --mt:#122226} .m11{--ma:#C4AC7E; --mt:#231E12}

  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Serif KR","나눔명조","Batang",serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
    padding:0 20px 64px;
  }
  /* 띠는 아래 스크립트가 달마다 편수 비율로 다시 그린다 — 손으로 고칠 일이 없다 */
  body::before{content:""; display:block; height:6px; margin:0 -20px 0;
    background:var(--bar, var(--accent))}
  .wrap{max-width:680px; margin:0 auto}

  header{padding:56px 0 30px; text-align:center; border-bottom:1px solid var(--line)}
  .eyebrow{font-size:.72rem; letter-spacing:.22em; color:var(--accent);
           text-transform:uppercase; margin-bottom:16px; font-weight:600}
  h1{font-size:1.85rem; letter-spacing:-.02em; line-height:1.35; margin-bottom:14px}
  .tagline{color:var(--sub); font-size:.97rem; line-height:1.85}
  .byline{margin-top:20px; font-size:.87rem; color:var(--sub)}
  .byline b{color:var(--ink); font-weight:600}

  .count{padding:26px 0 6px; font-size:.8rem; letter-spacing:.06em;
         color:var(--sub); text-align:center}
  .tally{display:flex; justify-content:center; flex-wrap:wrap; gap:7px; padding-bottom:18px}
  .tally span{font-size:.72rem; letter-spacing:.04em; color:var(--ma);
              background:var(--mt); border-radius:100px; padding:3px 11px}

  ol{list-style:none}
  li.mh{
    margin:26px 0 10px; font-size:.74rem; letter-spacing:.18em;
    color:var(--ma); font-weight:600; display:flex; align-items:center; gap:10px;
  }
  li.mh::after{content:""; flex:1; height:1px; background:var(--ma); opacity:.28}
  li.row{margin-bottom:6px}
  a.item{
    display:flex; gap:14px; align-items:baseline;
    padding:15px 16px; text-decoration:none; color:inherit;
    background:var(--mt); border-left:6px solid var(--ma);
    transition:transform .13s ease, box-shadow .13s ease;
  }
  a.item:hover{transform:translateX(2px); box-shadow:0 3px 12px rgba(0,0,0,.09)}
  .num{
    flex:0 0 auto; min-width:24px; text-align:center;
    font-size:.72rem; color:#fff; background:var(--ma); font-weight:600;
    font-variant-numeric:tabular-nums; border-radius:100px; padding:2px 7px;
  }
  .body{flex:1 1 auto; min-width:0}
  .title{font-size:1.03rem; line-height:1.55; letter-spacing:-.01em}
  .meta{margin-top:5px; font-size:.78rem; color:var(--sub);
        display:flex; flex-wrap:wrap; gap:9px; align-items:center}
  .date{font-variant-numeric:tabular-nums}
  .book{color:var(--ma); font-weight:600}
  .book::before{content:"· "; color:var(--sub); font-weight:400}
  .mh .cnt{letter-spacing:.04em; opacity:.75; font-weight:400}

  footer{margin-top:44px; padding-top:26px; border-top:1px solid var(--line);
         text-align:center; font-size:.83rem; color:var(--sub); line-height:2}
  footer a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent}
  footer a:hover{border-bottom-color:var(--accent)}
  .sig{margin-top:18px; font-size:.9rem; color:var(--ink)}

  @media (max-width:520px){
    header{padding:40px 0 24px}
    h1{font-size:1.5rem}
    a.item{padding:15px 6px; gap:12px}
    .title{font-size:.97rem}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">Book Column</div>
  <h1>이서윤의 문장연구소</h1>
  <p class="tagline">책 한 권과 삶 한 자락을 포개어 씁니다.<br>퇴직을 앞두고, 또 건너와서 읽고 쓴 기록입니다.</p>
  <p class="byline"><b>이서윤</b> · 북칼럼니스트 &nbsp;|&nbsp; 한국강사신문 연재</p>
</header>

<p class="count" id="count"></p>
<div class="tally" id="tally"></div>

<ol id="list"></ol>

<footer>
  『아무튼 지치지 않도록』 저자<br>
  <a href="https://www.lecturernews.com/news/articleList.html?sc_area=I&amp;sc_word=lsy0769" target="_blank" rel="noopener">한국강사신문 필자 페이지</a>
  <div class="sig">읽고, 쓰고, 건너갑니다.</div>
</footer>

</div>

<script>
const D = [
 [1,"2026.04.15","꿈꾸는 대로, 말하는 대로",200548,"월터의 상상은 현실이 된다"],
 [2,"2026.04.21","돈키호테 완독의 힘",200840,"돈키호테"],
 [3,"2026.04.28","필사적인 필사, 내 문장을 만드는 시간",201257,"위반하는 글쓰기"],
 [4,"2026.05.04","코칭에서 떨어지며 배운 것들, 은퇴 준비의 시작",201659,""],
 [5,"2026.05.07","퇴직은 준비된 사람에게만 새로운 시작이다",201882,"끝난 사람"],
 [6,"2026.05.11","잘하고 싶은 마음과 좋아하는 마음 사이",202134,""],
 [7,"2026.05.14","책을 읽고 잊어버려도 남는 것",202346,"깊이에의 강요"],
 [8,"2026.05.18","보이지 않은 짐을 들고",202580,"나의 인생"],
 [9,"2026.05.20","마음 속의 달, 현실 속의 6펜스",202761,"달과 6펜스"],
 [10,"2026.05.25","단단한 독서, 단단한 노후",203065,"단단한 독서"],
 [11,"2026.05.27","매일 새벽, 나를 쓰는 시간",203164,""],
 [12,"2026.05.29","숲은 아직 멀었지만",203303,""],
 [13,"2026.06.01","삶의 방향을 잃지 않기 위해",203472,""],
 [14,"2026.06.03","여섯 장을 버리고서야",203578,""],
 [15,"2026.06.05","은퇴 준비는 강점을 발견하는 일",203658,""],
 [16,"2026.06.08","비밀의 언덕에 앉아",203808,"비밀의 언덕"],
 [17,"2026.06.10","나만의 시간을 지키는 일",203929,"빵 굽는 타자기"],
 [18,"2026.06.12","글쓰기로 건네는 응원",204066,"파인딩 포레스터"],
 [19,"2026.06.15","나의 트로이 전쟁은 끝났는가",204300,"일리아스"],
 [20,"2026.06.17","명함이 사라진 자리, 진짜 내 모습으로 살아갈 시간",204417,"오뒷세이아"],
 [21,"2026.06.19","작은 정원",204522,"작은 정원"],
 [22,"2026.06.23","퇴직 이후 계속 읽고 쓸 수 있는가",204736,"스토너"],
 [23,"2026.06.24","위대한 낭비와 고귀한 침묵",204865,"바베트의 만찬"],
 [24,"2026.06.26","노년을 품위 있게 보내는 세 가지 무기",205028,"노년에 관하여"],
 [25,"2026.06.29","내 안의 화(火)를 다스리는 시간, 유예의 지혜",205261,"화에 대하여"],
 [26,"2026.07.01","한 사람과 한 마리가 어떻게든 살아보마",205372,"고양이와 할아버지"],
 [27,"2026.07.06","36년 다닌 직장에 사표를 던진 이유",205702,"삶의 한가운데"],
 [28,"2026.07.09","나는 지금 발효 중입니다",205959,""],
 [29,"2026.07.13","나만의 충만한 하루를 살기 시작했다",206190,"퍼펙트 데이즈"],
 [30,"2026.07.16","엄마의 거친 손등에서 배운 삶의 문법",206487,"위대한 유산"],
 [31,"2026.07.20","319일의 기록, 나는 다른 삶을 선택했다",206699,"아티스트 웨이"],
 [32,"2026.07.23","텃밭과 글밭",206922,""],
 [33,"2026.07.29","각자의 골방, 마콘도",207362,"백년의 고독"],
 [34,"2026.08.06","고향이라 믿었던 곳",207843,"광인일기"],
 [35,"2026.08.12","50대 후반부터 90대 초반까지, 함께 읽고 쓴 8주의 기록",208325,""],
 [36,"2026.08.18","3년의 토요일과 오늘의 세 줄",208839,""],
 [37,"2026.08.25","퇴직 후 가장 먼저 한 일",209314,""],
 [38,"2026.09.01","3년을 미루고, 20분에 끝냈다",209801,""]
];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mo = d => d.slice(5,7).replace(/^0/,'');
const counts = D.reduce((a,[,d]) => (a[mo(d)] = (a[mo(d)]||0)+1, a), {});
/* 편수는 목록에서 세어 쓴다 — 한 줄 더할 때 위 문구를 따로 안 고쳐도 되게 */
document.querySelector('.count').textContent = `전 ${D.length}편 · ${D[0][1].replace(/\./g,'.')} — 연재 중`;
let cur = '';
document.getElementById('list').innerHTML = D.map(([n,d,t,id,b]) => {
  const m = mo(d);
  let head = '';
  if (m !== cur) {
    cur = m;
    head = `<li class="mh m${m}"><span>${d.slice(0,4)}년 ${m}월</span><span class="cnt">${counts[m]}편</span></li>`;
  }
  return head + `
  <li class="row m${m}"><a class="item" href="https://www.lecturernews.com/news/articleView.html?idxno=${id}" target="_blank" rel="noopener">
    <span class="num">${n}</span>
    <span class="body">
      <span class="title">${esc(t)}</span>
      <span class="meta"><span class="date">${d}</span>${b ? `<span class="book">${esc(b)}</span>` : ''}</span>
    </span>
  </a></li>`;
}).join('');

document.getElementById('tally').innerHTML = Object.keys(counts)
  .sort((a,b) => a-b)
  .map(m => `<span class="m${m}">${m}월 ${counts[m]}편</span>`).join('');

/* 전 N편 — 데이터에서 센다 */
document.getElementById('count').textContent =
  `전 ${D.length}편 · ${D[0][1]} — 연재 중`;

/* 맨 위 띠 — 달이 나온 순서대로, 달마다 편수 비율만큼 칠한다.
   새 달이 늘어도 손댈 것이 없다. 색은 .m1~.m12에서 그대로 읽어 온다. */
(() => {
  const seen = [];
  D.forEach(([, d]) => { const m = mo(d); if (!seen.includes(m)) seen.push(m); });
  const probe = document.createElement('span');
  probe.style.display = 'none';
  document.body.appendChild(probe);
  const stops = [];
  let at = 0;
  seen.forEach((m, i) => {
    probe.className = 'm' + m;
    const c = getComputedStyle(probe).getPropertyValue('--ma').trim() || '#8a6f47';
    const to = i === seen.length - 1 ? 100 : at + (counts[m] / D.length) * 100;
    stops.push(`${c} ${at.toFixed(2)}% ${to.toFixed(2)}%`);
    at = to;
  });
  probe.remove();
  document.documentElement.style.setProperty('--bar', `linear-gradient(90deg,${stops.join(',')})`);
})();
</script>
</body>
</html>
